name: Documentation
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write
jobs:
  build:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # authentication for same-repo deploys / PR previews
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}  # SSH deploy key (preferred; enables fork PR previews)
        run: julia --project=docs docs/make.jl
